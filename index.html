<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Virtual360</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="script.js"></script>
    <link rel="stylesheet" href="style.css" />
</head>

<body class="bg-gray-900 text-white font-sans">

    <header class="bg-gray-800 shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-green-400">Virtual360</h1>
            <nav class="space-x-6">
                <a href="#" class="text-white hover:text-green-400">Home</a>
                <a href="#" class="text-white hover:text-green-400">About</a>
                <a href="#" class="text-white hover:text-green-400">Sign Up</a>
                <a href="#" class="text-white hover:text-green-400">Log In</a>
                <a href="#" class="text-white hover:text-green-400">Contact</a>
            </nav>
        </div>
    </header>

    <section class="text-center py-20 px-6">
        <h2 class="text-5xl font-bold text-green-400 mb-6">Play All Your Favorite Games</h2>
        <p class="text-lg text-gray-300 mb-8">
            Connect with players worldwide, compete in a variety of games for all ages — from action-packed adventures
            to family-friendly fun.
            Virtual360 brings endless entertainment to your fingertips.
        </p>
        <div class="space-x-4">
            <button class="bg-green-500 hover:bg-green-600 text-white px-6 py-3 rounded-full">Start Match</button>
            <button class="bg-gray-700 hover:bg-gray-600 text-white px-6 py-3 rounded-full">Join Lobby</button>
        </div>
    </section>

</body>

</html>
